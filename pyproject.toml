[project]
name = "kc19-watch"
version = "0.4.1"
description = "ホテル空室監視 + Telegram通知 + Webダッシュボード + 自動予約"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21,<22",
    "requests>=2.32",
    "psutil>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "playwright>=1.40",
    "pyyaml>=6.0",
]

[project.scripts]
# uv run kemocon        -> Webダッシュボード + Bot(通知) を同時起動
# uv run kemocon-bot    -> Botのみ(去年と同じ挙動、ダッシュボードなし)
kemocon = "kemocon.web:run"
kemocon-bot = "kemocon.bot:run_bot_only"

[dependency-groups]
# 配布用exeのビルドにのみ必要(uv sync で入る)
dev = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kemocon"]
