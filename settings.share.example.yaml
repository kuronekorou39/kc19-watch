# ============================================================
# 共有設定ファイルのひな形
#
# このファイルを「settings.share.yaml」という名前でコピーして
# 実際の値を埋め、利用者に別途配布してください。
# (実値入りの settings.share.yaml は .gitignore 済み。リポジトリに置かない)
#
# 利用者側の使い方:
#   - kc19-watch.exe と同じフォルダに置く → 起動時に自動で取り込まれる
#   - または画面の「設定」タブ →「📄 設定ファイルを読み込む」から選ぶ
# ============================================================

monitor:
  yado_id: ""              # 施設ID
  api_ty: "lim,sp"         # 通常は変更不要
  target_year: "2026"      # 対象年

  site:
    api_url: ""            # 在庫検索APIのURL
    date_url: ""           # 予約カレンダーページのURL
    form_url: ""           # 予約入力フォームのURL

  menu_url: ""             # メニューページのURL(通知内の予約リンクにも使う)

  # 走査(データ取得)は全部屋が対象で、部屋名も自動で取得されます。
  # 限定したい場合だけ room_id を列挙(通常は書かない)
  # scan_room_ids: ["7"]

  # 空室が出たときに Telegram 通知する部屋(room_id)。書かない/空 = 全部屋を通知。
  # 利用者は画面の「設定」タブのチェックボックスからも変更できます
  # notify_room_ids: ["7"]

  # 部屋の表示名を上書きしたい場合だけ(通常は予約サイトの部屋名が自動で使われる)
  # target_rooms:
  #   - label: "見やすい表示名"
  #     room_id: "7"

  # 監視プラン。3連泊プランは初日だけ、1泊プランは泊まれる各日を dates に書く。
  # ここに列挙したプラン全部が走査される(1周期のリクエスト数 = プラン数 × 人数)
  plans:
    - id: "0"
      label: "プランの表示名"
      dates: ["11/6"]
      nights: 1

  guest_nums: [2, 3, 4, 5] # 検索する人数(人数ごとに別々に検索し、部屋の和集合を取る)
  interval_seconds: 120    # 監視間隔(秒)。プラン数×人数が多いときは長めに

# Telegramトークンも配布ファイルに含めたい場合だけコメントを外す
# (通常は各自が画面の「設定」タブから入力する)
# telegram:
#   bot_token: ""
